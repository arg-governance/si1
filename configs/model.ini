; ============================================================
; SI-1 / Lucifer — llama.cpp configuration
; Derived from Ollama ModelFile_Lucifer (HERETICODER-2.5-3B-IT.Q8_0)
; ============================================================

[model]
; Path to the GGUF model file. Override via SI1_LLAMA_MODEL env var.
path = E:\SI-1\models\HERETICODER-2.5-3B-IT.i1-Q6_K.gguf
; Optional: alternate Q8_0 build
; path = E:\HERETICODER-2.5-3B-IT.Q8_0.gguf

[system]
; Path to the system prompt file (SI-1 Constitutional Cognitive Architecture V1.3).
; Loaded by si1.py and injected as the first chat message.
prompt_file = core/system_prompt_lucifer.txt

[chat_template]
; Custom ChatML template that overrides the embedded Qwen template.
; Mirrors the TEMPLATE block from ModelFile_Lucifer (without the tool-call branch,
; which is unused for SI-1 runtime).
file = configs/lucifer_template.txt

[sampling]
; Mirrors PARAMETER block from ModelFile_Lucifer
temperature    = 0.00
top_p          = 1.0
top_k          = 1
repeat_penalty = 1.05
repeat_last_n  = 128

[context]
num_ctx        = 4096
num_predict    = 512
draft_num_predict = 128

[server]
host  = 127.0.0.1
port  = 8080
threads = 8

[metadata]
name        = Lucifer
runtime     = SI-1 Constitutional Cognitive Architecture V1.3
base_model  = HERETICODER-2.5-3B-IT.Q8_0
quantization = Q6_K (i1)
source      = Ollama ModelFile_Lucifer
